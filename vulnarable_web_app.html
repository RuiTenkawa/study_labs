<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Галерея «Палитра»е</title>
<style>
  :root{
    --bg:#0b0e14;
    --panel:#141a24;
    --panel-2:#0f141c;
    --line:#222c3a;
    --text:#e7edf5;
    --muted:#8494a8;
    --accent:#8b5cf6;
    --accent-2:#22d3ee;
    --danger:#f87171;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    padding:28px 22px 60px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(900px 400px at 10% -10%, rgba(139,92,246,.18), transparent 60%),
      radial-gradient(700px 400px at 90% 0%, rgba(34,211,238,.12), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
  }

  header{max-width:1180px;margin:0 auto 20px;}

  h1{
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:-.4px;
  }

  h1 span{
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .sub{color:var(--muted);font-size:13.5px;}

  .warn{
    max-width:1180px;
    margin:0 auto 22px;
    background:rgba(248,113,113,.09);
    border:1px solid rgba(248,113,113,.35);
    border-left:4px solid var(--danger);
    padding:12px 16px;
    border-radius:8px;
    font-size:13px;
    line-height:1.5;
    color:#ffc9c9;
  }

  .warn b{color:#fff;}

  .layout{
    max-width:1180px;
    margin:0 auto;
    display:grid;
    gap:18px;
    grid-template-columns:1fr 1fr;
  }

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
  }

  .full{grid-column:1 / -1;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px;
  }

  .card h2{
    font-size:15px;
    margin:0 0 4px;
    letter-spacing:-.2px;
  }

  .tag{
    display:inline-block;
    font-size:10px;
    letter-spacing:.6px;
    text-transform:uppercase;
    font-weight:700;
    padding:3px 8px;
    border-radius:20px;
    background:rgba(248,113,113,.14);
    border:1px solid rgba(248,113,113,.3);
    color:#ff9c94;
    margin-bottom:10px;
  }

  .hint{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 12px;
    line-height:1.5;
  }

  label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    margin:10px 0 5px;
  }

  input,textarea,select,button{
    font:inherit;
    font-size:14px;
    width:100%;
    border-radius:8px;
    border:1px solid #2b3648;
    background:var(--panel-2);
    color:var(--text);
    padding:10px 12px;
    transition:border-color .15s,background .15s;
  }

  input:focus,textarea:focus,select:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(139,92,246,.15);
  }

  textarea{resize:vertical;min-height:70px;}

  button{
    background:linear-gradient(135deg,var(--accent),#6d28d9);
    border:none;
    cursor:pointer;
    font-weight:600;
    margin-top:10px;
    color:#fff;
  }

  button:hover{filter:brightness(1.12);}

  button.ghost{
    background:transparent;
    border:1px solid #2b3648;
    color:var(--muted);
    font-weight:500;
  }

  button.ghost:hover{background:#1a2130;color:var(--text);}

  .row{display:flex;gap:10px;}
  .row > *{flex:1;}

  .out{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12.5px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    margin-top:10px;
    white-space:pre-wrap;
    word-break:break-word;
    color:#9fb0c6;
    min-height:20px;
    line-height:1.55;
  }

  .out.ok{color:#86efac;border-color:rgba(134,239,172,.3);}

  /* ── Галерея ── */
  .grid{
    display:grid;
    gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    margin-top:14px;
  }

  .art{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    transition:transform .18s,border-color .18s;
  }

  .art:hover{transform:translateY(-3px);border-color:#3a4761;}

  .art-img{
    height:130px;
    background:
      radial-gradient(circle at 22% 28%, rgba(255,255,255,.22), transparent 45%),
      radial-gradient(circle at 78% 74%, rgba(255,255,255,.10), transparent 42%),
      linear-gradient(135deg, var(--c1), var(--c2));
    position:relative;
  }

  .art-img::after{
    content:"";
    position:absolute;
    inset:22% 30%;
    border:1.5px solid rgba(255,255,255,.35);
    border-radius:4px;
    transform:rotate(-12deg);
  }

  .art-body{padding:10px 12px 12px;}

  .art-body h3{
    font-size:13.5px;
    margin:0 0 3px;
    font-weight:600;
  }

  .art-body .author{
    font-size:12px;
    color:var(--muted);
    margin:0 0 8px;
  }

  .chips{display:flex;flex-wrap:wrap;gap:5px;}

  .chip{
    font-size:10.5px;
    padding:2px 7px;
    border-radius:20px;
    background:rgba(139,92,246,.14);
    border:1px solid rgba(139,92,246,.32);
    color:#c4b5fd;
  }

  /* ── Отзывы ── */
  #comments{margin-top:6px;}

  .comment{
    border-bottom:1px solid var(--line);
    padding:11px 0;
    font-size:13.5px;
    line-height:1.55;
  }

  .comment:last-child{border-bottom:none;}

  .comment .head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:4px;
  }

  .comment b{color:var(--accent-2);font-weight:600;font-size:13px;}

  .comment .time{font-size:11px;color:#5b6b80;}

  .comment p{margin:0;color:#c3cedd;}

  .empty{color:#5b6b80;font-size:13px;padding:8px 0;}
</style>
</head>
<body>

<header>
  <h1>Галерея <span>«Палитра»</span></h1>
  <div class="sub">Публичная онлайн-галерея</div>
</header>

<div class="layout">

  <!-- ══════════ УЯЗВИМОСТЬ 1: ПДн в localStorage ══════════ -->
  <section class="card">
    <h2>Личный кабинет посетителя</h2>

    <label for="fullName">ФИО</label>
    <input id="fullName" placeholder="Иванова Мария Сергеевна" autocomplete="off">

    <label for="passport">Серия и номер паспорта</label>
    <input id="passport" placeholder="4512 345678" autocomplete="off">

    <label for="phone">Номер телефона</label>
    <input id="phone" placeholder="+7 912 345-67-89" autocomplete="off">

    <button onclick="saveProfile()">Сохранить профиль</button>
    <button class="ghost" onclick="dumpStorage()">Показать, что лежит в localStorage</button>

    <div class="out" id="profileOut">Профиль не сохранён.</div>
    <div class="out" id="dumpOut" style="display:none"></div>
  </section>

  <!-- ══════════ УЯЗВИМОСТЬ 3: eval() в поиске ══════════ -->
  <section class="card">
    <h2>Поиск по тегам и авторам</h2>

    <label for="q">Тег, автор или название</label>
    <input id="q" placeholder="пейзаж / Волкова / Ночь" autocomplete="off"
           onkeydown="if(event.key==='Enter') doSearch()">

    <div class="row">
      <button onclick="doSearch()">Найти</button>
      <button class="ghost" onclick="resetSearch()">Сбросить</button>
    </div>

    <div class="out" id="searchOut">Показаны все работы.</div>
  </section>

  <!-- ══════════ ГАЛЕРЕЯ ══════════ -->
  <section class="card full">
    <h2>Экспозиция</h2>
    <p class="hint">Восемь вымышленных работ вымышленных авторов.</p>
    <div class="grid" id="grid"></div>
  </section>

  <!-- ══════════ УЯЗВИМОСТЬ 2: XSS ══════════ -->
  <section class="card full">
    <h2>Гостевая книга галереи</h2>

    <div class="row">
      <div>
        <label for="cName">Имя</label>
        <input id="cName" placeholder="Посетитель" autocomplete="off">
      </div>
      <div>
        <label for="cText">Комментарий</label>
        <input id="cText" placeholder="Прекрасная выставка!" autocomplete="off">
      </div>
    </div>

    <div class="row" style="margin-top:10px">
      <button onclick="addComment()">Оставить отзыв</button>
      <button class="ghost" onclick="clearComments()">Очистить книгу</button>
    </div>

    <div id="comments"></div>
  </section>

</div>

<script>
/* ============================================================
   ДАННЫЕ ГАЛЕРЕИ
   ============================================================ */
const artworks = [
  { id:1, title:'Северное сияние', author:'А. Волкова',  tags:['пейзаж','ночь','небо'],  c1:'#1e3a8a', c2:'#22d3ee' },
  { id:2, title:'Тёплый вечер',    author:'И. Соколов',  tags:['пейзаж','закат','море'], c1:'#b45309', c2:'#f43f5e' },
  { id:3, title:'Городской ритм',  author:'Д. Крылов',   tags:['город','ночь','абстракция'], c1:'#312e81', c2:'#8b5cf6' },
  { id:4, title:'Лесная тропа',    author:'А. Волкова',  tags:['природа','лес','утро'],  c1:'#14532d', c2:'#65a30d' },
  { id:5, title:'Портрет в синем', author:'М. Захарова', tags:['портрет','синий'],       c1:'#0c4a6e', c2:'#38bdf8' },
  { id:6, title:'Пыль и свет',     author:'И. Соколов',  tags:['абстракция','свет'],     c1:'#78350f', c2:'#fbbf24' },
  { id:7, title:'Зимнее утро',     author:'О. Лебедева', tags:['природа','зима','утро'], c1:'#334155', c2:'#cbd5e1' },
  { id:8, title:'Красный квадрат', author:'М. Захарова', tags:['абстракция','геометрия'],c1:'#7f1d1d', c2:'#ef4444' },
];

/* ============================================================
   ОТРИСОВКА ГАЛЕРЕИ
   ============================================================ */
function render(list){
  const grid = document.getElementById('grid');

  if(!list.length){
    grid.innerHTML = '<div class="empty">Ничего не найдено.</div>';
    return;
  }

  grid.innerHTML = list.map(a => `
    <article class="art">
      <div class="art-img" style="--c1:${a.c1}; --c2:${a.c2}"></div>
      <div class="art-body">
        <h3>${a.title}</h3>
        <p class="author">${a.author}</p>
        <div class="chips">
          ${a.tags.map(t => `<span class="chip">#${t}</span>`).join('')}
        </div>
      </div>
    </article>
  `).join('');
}

/* ============================================================
   УЯЗВИМОСТЬ 1 — Sensitive Data Exposure (ПДн по 152-ФЗ)

   ФИО, паспорт и телефон пишутся в localStorage как есть.
   Любой скрипт на странице — в том числе внедрённый через XSS
   из гостевой книги — может их прочитать одной строкой:

       JSON.parse(localStorage.getItem('profile'))

   В реальном приложении это прямой инцидент по 152-ФЗ:
   утечка специальных категорий персональных данных.
   ============================================================ */
function saveProfile(){
  const profile = {
    fullName : document.getElementById('fullName').value.trim(),
    passport : document.getElementById('passport').value.trim(),
    phone    : document.getElementById('phone').value.trim(),
    savedAt  : new Date().toISOString()
  };

  if(!profile.fullName && !profile.passport && !profile.phone){
    document.getElementById('profileOut').textContent = 'Заполните хотя бы одно поле.';
    return;
  }

  localStorage.setItem('profile', JSON.stringify(profile));

  const out = document.getElementById('profileOut');
  out.className = 'out ok';
  out.textContent =
    'Профиль сохранён в localStorage:\n' +
    'ФИО:      ' + (profile.fullName || '—') + '\n' +
    'Паспорт:  ' + (profile.passport || '—') + '\n' +
    'Телефон:  ' + (profile.phone    || '—');
}

function dumpStorage(){
  const box = document.getElementById('dumpOut');
  box.style.display = 'block';

  if(!localStorage.length){
    box.textContent = 'localStorage пуст.';
    return;
  }

  let s = '🔓 Содержимое localStorage (видно любому скрипту):\n\n';
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    s += k + ' = ' + localStorage.getItem(k) + '\n\n';
  }
  box.textContent = s.trimEnd();
}

/* ============================================================
   УЯЗВИМОСТЬ 2 — Stored XSS

   Имя и текст отзыва вставляются в разметку через innerHTML.
   Браузер воспринимает их как HTML и выполняет любой скрипт.
   ============================================================ */
let comments = JSON.parse(localStorage.getItem('comments') || '[]');

function renderComments(){
  const box = document.getElementById('comments');

  if(!comments.length){
    box.innerHTML = '<div class="empty">Пока нет отзывов. Будьте первым.</div>';
    return;
  }

  box.innerHTML = comments.map(c => `
    <div class="comment">
      <div class="head">
        <b>${c.name}</b>
        <span class="time">${c.time}</span>
      </div>
      <p>${c.text}</p>
    </div>
  `).join('');
}

function addComment(){
  const nameEl = document.getElementById('cName');
  const textEl = document.getElementById('cText');

  const name = nameEl.value.trim() || 'Аноним';
  const text = textEl.value.trim();

  if(!text) return;

  comments.push({
    name,
    text,
    time: new Date().toLocaleString('ru-RU')
  });

  localStorage.setItem('comments', JSON.stringify(comments));

  nameEl.value = '';
  textEl.value = '';
  renderComments();
}

function clearComments(){
  comments = [];
  localStorage.removeItem('comments');
  renderComments();
}

/* ============================================================
   УЯЗВИМОСТЬ 3 — Code Injection через eval()

   Ввод пользователя попадает прямо в тело JS-выражения.
   Кавычка в запросе разрывает строку и позволяет выполнить
   произвольный код в контексте страницы.
   ============================================================ */
function doSearch(){
  const q   = document.getElementById('q').value.trim();
  const out = document.getElementById('searchOut');

  if(!q){
    render(artworks);
    out.textContent = 'Показаны все работы.';
    return;
  }

  try{
    const code =
      "artworks.filter(a => " +
      "a.tags.includes('" + q + "') || " +
      "a.author.includes('" + q + "') || " +
      "a.title.includes('" + q + "'))";

    const found = eval(code);

    render(found);
    out.textContent = 'Найдено работ: ' + found.length;
  }catch(e){
    out.textContent = 'Ошибка выполнения: ' + e.message;
  }
}

function resetSearch(){
  document.getElementById('q').value = '';
  render(artworks);
  document.getElementById('searchOut').textContent = 'Показаны все работы.';
}

render(artworks);
renderComments();

(function restoreProfile(){
  const raw = localStorage.getItem('profile');
  if(!raw) return;

  try{
    const p = JSON.parse(raw);
    document.getElementById('fullName').value = p.fullName || '';
    document.getElementById('passport').value = p.passport || '';
    document.getElementById('phone').value    = p.phone    || '';

    const out = document.getElementById('profileOut');
    out.className = 'out ok';
    out.textContent =
      'Профиль восстановлен из localStorage:\n' +
      'ФИО:      ' + (p.fullName || '—') + '\n' +
      'Паспорт:  ' + (p.passport || '—') + '\n' +
      'Телефон:  ' + (p.phone    || '—');
  }catch(e){}
})();
</script>

</body>
</html>
